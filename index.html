<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indie Den — магазин инди-игр</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- ===== Шапка-пульт ===== -->
  <header class="site-header">

    <!-- Логотип -->
    <a class="logo" href="index.html">
      <i class="fas fa-gamepad"></i>
      Indie<span class="accent">Den</span>
    </a>

    <!-- Поиск, который понимает фразы -->
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search" placeholder="уютный рогалик про сад, кооп на вечер, игра на 15 минут..."
             autocomplete="off">
    </div>

    <!-- Переключатель настроения -->
    <div class="mood">
      <div class="mood-group" id="moodLightDark">
        <button class="mood-btn active" data-mode="dark" title="Тёмная тема">
          <i class="fas fa-moon"></i> Тьма
        </button>
        <button class="mood-btn" data-mode="light" title="Светлая тема">
          <i class="fas fa-sun"></i> Свет
        </button>
      </div>
      <div class="mood-group" id="moodCozyHardcore">
        <button class="mood-btn active" data-vibe="cozy" title="Спокойное настроение">
          <i class="fas fa-leaf"></i> Спокойно
        </button>
        <button class="mood-btn" data-vibe="hardcore" title="Хардкорное настроение">
          <i class="fas fa-skull"></i> Хардкор
        </button>
      </div>
    </div>

    <!-- Кнопки меню -->
    <nav class="nav">
      <a href="#" class="active">Каталог</a>
      <a href="#">Новинки</a>
      <a href="#">Скидки</a>
      <a href="#">Сообщество</a>
      <a href="loots-market.html">Лутс Маркет</a>
    </nav>

    <!-- Профиль -->
    <a class="profile" href="#">
      <i class="fas fa-user-circle"></i>
      Профиль
    </a>
  </header>

  <!-- ===== Заглушка под остальные секции плана ===== -->
  <main class="main">
    <div class="placeholder">
      <i class="fas fa-cubes"></i>
      <h2>Главная в разработке</h2>
      <p>Реализована только шапка. Остальные секции — по плану <code>docs/homepage-plan.md</code>.</p>
      <div class="tags">
        <span>Сцена дня</span>
        <span>Полка настроений</span>
        <span>Три прилавка</span>
        <span>Двор разработчиков</span>
        <span>Демо-зал</span>
        <span>Кооп-площадка</span>
        <span>События</span>
        <span>Ваш угол</span>
        <span>Пульс</span>
      </div>
    </div>
  </main>

  <script>
    // ==== Переключатель Свет / Тьма ====
    const themeBtns = document.querySelectorAll('#moodLightDark .mood-btn');
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        themeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.body.classList.toggle('theme-light', btn.dataset.mode === 'light');
      });
    });

    // ==== Переключатель Спокойно / Хардкор (пока только активное состояние) ====
    const vibeBtns = document.querySelectorAll('#moodCozyHardcore .mood-btn');
    vibeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        vibeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
